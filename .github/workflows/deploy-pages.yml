name: Deploy to GitHub Pages

# Opt-in and fork-safe: nothing deploys unless the repository variable
# DEPLOY_PAGES is set to 'true' (Settings > Secrets and variables > Actions >
# Variables) and Settings > Pages > Source is set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Served from https://<owner>.github.io/<repo>/, so the base path follows the repo name.
          BASE_PATH: /${{ github.event.repository.name }}/
          # The parent area's source link points at whichever repository deployed it.
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    if: vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
